<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sport Flex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" />
  <style>
    :root {
      --bg: #f3f5f7;
      --surface: #ffffff;
      --surface-2: #f7f9fa;
      --line: #e3e8ec;
      --ink: #14202b;
      --ink-2: #4b5966;
      --ink-3: #8794a0;
      --accent: #0e9f6e;
      --accent-ink: #087a54;
      --accent-soft: #e3f6ee;
      --accent-line: #b9e8d4;
      --warn: #b45309;
      --warn-soft: #fdf3e2;
      --danger: #dc4a32;
      --danger-soft: #fdece8;
      --taken: #eef1f4;
      --shadow: 0 1px 2px rgba(20, 32, 43, .04), 0 6px 24px rgba(20, 32, 43, .06);
      --radius: 14px;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1318;
        --surface: #151d24;
        --surface-2: #1b252e;
        --line: #26323d;
        --ink: #e6edf2;
        --ink-2: #a9b6c1;
        --ink-3: #6f7d89;
        --accent: #2fc28c;
        --accent-ink: #5ad8a8;
        --accent-soft: #123528;
        --accent-line: #1e5a43;
        --warn: #f0b35a;
        --warn-soft: #3a2a12;
        --danger: #ff7a62;
        --danger-soft: #3d1c16;
        --taken: #1d2730;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .25);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Noto Sans TC", "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .muted { color: var(--ink-3); }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ---- top bar ---- */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1240px; margin: 0 auto; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--accent); display: grid; place-items: center;
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-name { font-weight: 700; font-size: 16px; letter-spacing: .01em; }
    .brand-sub { font-size: 12px; color: var(--ink-3); }
    .picker {
      display: flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); border-radius: 10px; padding: 0 4px 0 10px;
      background: var(--surface);
    }
    .picker label { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
    .picker select { border: 0; background: transparent; padding: 7px 4px; outline: none; max-width: 180px; }
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 6px 10px; border-radius: 999px;
      background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
    .status.on .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .status.off .dot { background: var(--warn); }

    /* ---- layout ---- */
    .page { max-width: 1240px; margin: 0 auto; padding: 20px; }
    .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }
    .layout > * { min-width: 0; }
    .sticky { position: sticky; top: 76px; }
    @media (max-width: 920px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .grid .court-col { min-width: 86px; padding: 8px; }
      .cell { width: 50px; }
      .sticky { position: static; }
      .page { padding: 14px; }
    }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 0; }
    .card-title { font-size: 15px; font-weight: 700; margin: 0; }
    .card-body { padding: 14px 18px 18px; }
    .divider { height: 1px; background: var(--line); margin: 14px 0; }

    /* ---- login banner ---- */
    .login {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; margin-bottom: 16px;
      background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
      border-radius: var(--radius); color: var(--warn);
    }
    .login strong { margin-right: auto; }
    .login img { height: 38px; border-radius: 8px; background: #fff; border: 1px solid var(--line); }
    .login input {
      width: 110px; padding: 8px 10px; border-radius: 9px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    }

    /* ---- buttons ---- */
    .btn {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 10px; padding: 8px 14px; font-weight: 500;
      transition: background .15s, border-color .15s, transform .05s;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-ink); }
    .btn-danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
    .btn-block { width: 100%; padding: 11px 14px; font-size: 15px; }
    .icon-btn {
      width: 32px; height: 32px; display: grid; place-items: center;
      border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ---- snipe card ---- */
    .release { padding: 18px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
    .release-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .release-label { font-size: 12px; color: var(--ink-3); }
    .release-date { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .countdown { font-family: var(--mono); font-size: 34px; font-weight: 700; letter-spacing: .02em; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .countdown.live { color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .rule-chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }

    .targets { display: grid; gap: 8px; }
    .target {
      display: grid; grid-template-columns: 24px minmax(0, 1fr) 132px 30px; gap: 8px; align-items: center;
    }
    .target-no {
      width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
      font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent-ink);
    }
    .field {
      width: 100%; padding: 9px 10px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--surface); outline: none;
    }
    .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field:disabled { opacity: .7; }
    .remove { border: 0; background: transparent; color: var(--ink-3); font-size: 18px; line-height: 1; border-radius: 8px; height: 30px; }
    .remove:hover { background: var(--danger-soft); color: var(--danger); }
    .add-target { margin-top: 8px; width: 100%; border-style: dashed; color: var(--ink-2); }
    .hint { font-size: 12px; color: var(--ink-3); margin: 8px 0 0; }
    .watch-option {
      display: flex; align-items: flex-start; gap: 8px;
      margin: 10px 0 0; font-size: 13px; color: var(--ink-2); cursor: pointer;
    }
    .watch-option input { accent-color: var(--accent); width: 16px; height: 16px; margin-top: 2px; flex: 0 0 auto; }
    .weekdays { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    #routineTargets { margin-top: 8px; }
    .wd-btn {
      width: 36px; height: 36px; border-radius: 10px; font-weight: 700;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    }
    .wd-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .routine-actions { display: grid; gap: 8px; margin-top: 10px; }

    .stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0 12px; }
    .step { text-align: center; font-size: 11px; color: var(--ink-3); }
    .step-bar { height: 4px; border-radius: 4px; background: var(--line); margin-bottom: 6px; }
    .step.done .step-bar { background: var(--accent-line); }
    .step.current .step-bar { background: var(--accent); }
    .step.current { color: var(--accent-ink); font-weight: 700; }
    .alert { font-size: 13px; padding: 9px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); margin-bottom: 10px; }
    .tstatus { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 8px 0; border-top: 1px dashed var(--line); }
    .tstatus:first-child { border-top: 0; }
    .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
    .badge.ok { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
    .badge.skip { background: var(--taken); color: var(--ink-3); }

    details.log { margin-top: 12px; }
    details.log summary { cursor: pointer; font-size: 12px; color: var(--ink-3); list-style: none; }
    details.log summary::before { content: "▸ "; }
    details.log[open] summary::before { content: "▾ "; }
    .log-lines {
      margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2);
      font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--ink-2);
      max-height: 180px; overflow: auto; white-space: pre-wrap;
    }
    .jobs { font-size: 12px; color: var(--ink-3); margin-top: 10px; }

    /* ---- board ---- */
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); overflow-x: auto; max-width: 100%; }
    .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; color: var(--ink-2); white-space: nowrap; }
    .seg button.active { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .dates { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: thin; }
    .date {
      flex: 0 0 auto; width: 56px; padding: 7px 0; border-radius: 11px; text-align: center;
      border: 1px solid var(--line); background: var(--surface);
    }
    .date .wd { display: block; font-size: 11px; color: var(--ink-3); }
    .date .md { display: block; font-weight: 700; font-family: var(--mono); font-size: 13px; }
    .date.weekend .wd { color: var(--danger); }
    .date.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }
    .date.active .wd { color: inherit; opacity: .7; }

    .grid-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; }
    table.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: max-content; }
    .grid th, .grid td { padding: 0; border-bottom: 1px solid var(--line); }
    .grid tr:last-child td, .grid tr:last-child th { border-bottom: 0; }
    .grid thead th {
      font-size: 11px; font-weight: 500; color: var(--ink-3); font-family: var(--mono);
      padding: 8px 4px; background: var(--surface-2); text-align: center;
    }
    .grid .court-col {
      position: sticky; left: 0; z-index: 1; text-align: left; background: var(--surface);
      padding: 10px 12px; min-width: 112px; border-right: 1px solid var(--line);
    }
    .grid thead .court-col { background: var(--surface-2); }
    .court-name { font-weight: 700; font-size: 13px; }
    .court-meta { font-size: 11px; color: var(--ink-3); }
    .grid td { padding: 5px 3px; text-align: center; }
    .cell {
      width: 58px; height: 40px; border-radius: 9px; border: 1px solid transparent;
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; line-height: 1.2;
    }
    button.cell { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); font-weight: 700; }
    button.cell:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.cell small { font-weight: 500; opacity: .8; font-family: var(--mono); }
    .cell.taken { background: var(--taken); color: var(--ink-3); }
    .cell.mine { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
    .cell.none { color: var(--line); }
    .cell.pending { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    .board-status { min-height: 1.2em; margin: 8px 0 0; font-size: 12px; color: var(--ink-3); }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); margin-top: 10px; align-items: center; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
    .empty { padding: 36px 16px; text-align: center; color: var(--ink-3); }
    .skeleton { height: 40px; border-radius: 9px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin: 8px 12px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ---- sheet, toast, busy ---- */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 20, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
    .sheet { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--surface); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
    .sheet h2 { margin: 0; font-size: 17px; }
    .sheet img { width: 100%; border-radius: 12px; border: 1px solid var(--line); margin-top: 12px; }
    .sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .notice { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); margin-top: 10px; white-space: pre-wrap; word-break: break-all; }
    .notice.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
    a.btn { display: inline-flex; align-items: center; text-decoration: none; }
    .toast-box { position: fixed; z-index: 60; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); }
    .toast { padding: 11px 14px; border-radius: 12px; background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; animation: rise .2s ease-out; }
    .toast.error { background: var(--danger); color: #fff; }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
    .busy { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); }
    .busy-box { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- history ---- */
    .sheet.wide { width: min(780px, 100%); }
    .history-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .history-section { font-size: 13px; font-weight: 700; margin: 16px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .run { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface-2); }
    .run-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: center; }
    .run-date { font-weight: 700; }
    .badge.miss { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
    .badge.part { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
    .run-times { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
    .run-times b { font-family: var(--mono); font-weight: 700; color: var(--ink); }
    .run-target { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; font-size: 12px; padding: 6px 0 0; margin-top: 6px; border-top: 1px dashed var(--line); color: var(--ink-2); }
    .ev { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 8px; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); }
    .ev:first-child { border-top: 0; }
    .ev-at { font-family: var(--mono); color: var(--ink-3); font-size: 11.5px; }
    .ev.warn .ev-msg { color: var(--warn); }
    .ev.error .ev-msg { color: var(--danger); }
    .ev-kind { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-left: 6px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); }
    .stat-label { font-size: 12px; color: var(--ink-3); }
    .stat-value { font-family: var(--mono); font-weight: 700; font-size: 20px; line-height: 1.2; margin-top: 2px; }
    .stat-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .stat-note { font-size: 12.5px; color: var(--ink-2); margin: 8px 0 0; }
    .stats-empty { font-size: 13px; color: var(--ink-3); margin: 0; }
    .court-list { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; background: var(--surface); }
    .court-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: center; font-size: 13px; padding: 8px 0; border-top: 1px dashed var(--line); }
    .court-row:first-child { border-top: 0; }
    .court-row .mono { font-size: 12px; color: var(--ink-2); }
    @media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 14.5 9.5"/><circle cx="17" cy="7" r="3.2"/><path d="M4 20l1-1"/></svg>
        </div>
        <div>
          <div class="brand-name">Sport Flex</div>
          <div class="brand-sub" id="venueInfo">讀取場館…</div>
        </div>
      </div>
      <div class="picker"><label for="venueSelect">場館</label><select id="venueSelect"></select></div>
      <div class="picker"><label for="accountSelect">帳號</label><select id="accountSelect"></select></div>
      <span class="status hidden" id="instancePill" title="Telegram 驗證碼圖片開頭會標這個名稱，用來分辨是哪一台">這台</span>
      <span class="status" id="sessionPill"><span class="dot"></span><span id="sessionText">檢查登入…</span></span>
      <button class="icon-btn" id="historyBtn" type="button" title="歷史紀錄" aria-label="歷史紀錄">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="login hidden" id="loginBox">
      <strong id="loginTitle">這個帳號尚未登入，搶訂前需要先登入</strong>
      <button class="btn" id="loadCaptcha" type="button">顯示驗證碼</button>
      <img id="captcha" alt="驗證碼" class="hidden" />
      <input id="code" placeholder="驗證碼" autocomplete="off" />
      <button class="btn btn-primary" id="doLogin" type="button">登入</button>
      <span id="loginMsg"></span>
    </section>

    <div class="layout">
      <!-- snipe -->
      <section class="card sticky" aria-labelledby="snipeTitle">
        <div class="card-head">
          <h2 class="card-title" id="snipeTitle">搶尚未開放的場次</h2>
        </div>
        <div class="card-body">
          <div class="release">
            <div class="release-top">
              <div>
                <div class="release-label">下一波開放</div>
                <div class="release-date" id="targetLabel">—</div>
              </div>
              <div class="release-label" id="opensLabel"></div>
            </div>
            <div class="countdown" id="countdown">--:--:--</div>
            <div class="chips" id="ruleChips"></div>
          </div>

          <div class="divider"></div>

          <div id="routineBox">
            <div class="release-label">每週固定時段</div>
            <div class="weekdays" id="weekdays" role="group" aria-label="星期"></div>
            <div class="targets" id="routineTargets"></div>
            <button class="btn add-target" id="addRoutineTarget" type="button">＋ 再加一個時段</button>
            <p class="hint" id="routineStatus">選星期和時段後套用。之後每天開放前會自動排上第 14 天。</p>
            <div class="routine-actions">
              <button class="btn btn-primary btn-block" id="routineBtn" type="button">套用每週搶訂</button>
              <button class="btn btn-block hidden" id="routineOff" type="button">停用每週</button>
            </div>
          </div>

          <div class="divider"></div>

          <div id="setupBox">
            <div class="release-label">只搶下一波</div>
            <div class="targets" id="targets"></div>
            <button class="btn add-target" id="addTarget" type="button">＋ 再加一個目標</button>
            <p class="hint" id="targetHint"></p>
            <div style="margin-top:14px">
              <button class="btn btn-primary btn-block" id="snipeBtn" type="button">開始搶訂</button>
            </div>
          </div>

          <div id="runBox" class="hidden">
            <div class="stepper" id="stepper"></div>
            <div class="alert hidden" id="runAlert"></div>
            <p class="hint hidden" id="runNote"></p>
            <div id="runTargets"></div>
            <button class="btn btn-danger btn-block" id="cancelBtn" type="button" style="margin-top:12px">取消搶訂</button>
          </div>

          <details class="log" id="logBox">
            <summary>執行紀錄</summary>
            <div class="log-lines" id="log"></div>
          </details>
          <div class="divider"></div>
          <div id="watchBox">
            <div class="release-label">盯已開放的時段</div>
            <p class="hint" id="watchHint">用右側目前的日期和上午／下午／晚上。看到空檔就送出一筆訂單，然後停止。</p>
            <label class="watch-option" id="watchUntilFullLabel">
              <input type="checkbox" id="watchUntilFull" />
              <span id="watchUntilFullText">訂到當天上限才停</span>
            </label>
            <button class="btn btn-block" id="watchStart" type="button" style="margin-top:10px">開始盯場</button>
            <div id="watchRun" class="hidden">
              <div class="tstatus"><span id="watchStatus"></span><span class="badge">盯場中</span></div>
              <div class="log-lines" id="watchLog"></div>
              <button class="btn btn-danger btn-block" id="watchStop" type="button" style="margin-top:8px">停止盯場</button>
            </div>
          </div>
          <div class="jobs" id="jobs"></div>
        </div>
      </section>

      <!-- board -->
      <section class="card" aria-labelledby="boardTitle">
        <div class="card-head">
          <h2 class="card-title" id="boardTitle">場地時段</h2>
          <button class="icon-btn" id="reload" type="button" title="重新整理" aria-label="重新整理">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
        <div class="card-body">
          <div class="toolbar">
            <div class="seg" id="sports" role="tablist" aria-label="運動種類"></div>
            <div class="seg" id="periods" aria-label="時段">
              <button type="button" class="active" data-from="" data-to="">全天</button>
              <button type="button" data-from="06:00" data-to="12:00">上午</button>
              <button type="button" data-from="12:00" data-to="18:00">下午</button>
              <button type="button" data-from="18:00" data-to="23:00">晚上</button>
            </div>
          </div>
          <div class="dates" id="dates"></div>
          <p id="boardLock" class="alert hidden">開搶前後暫停查表和手動搶位，避免把預約頁帶走。</p>
          <p id="boardStatus" class="board-status" role="status"></p>
          <div id="board"></div>
          <div class="legend">
            <span><span class="swatch" style="background:var(--accent-soft);border:1px solid var(--accent-line)"></span>可預約（點擊搶）</span>
            <span><span class="swatch" style="background:var(--warn-soft)"></span>我已預約</span>
            <span><span class="swatch" style="background:var(--taken)"></span>已被預約</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="busy" class="busy hidden"><div class="busy-box"><span class="spinner"></span><span id="busyText">處理中…</span></div></div>
  <div id="modal" class="overlay hidden">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2 id="resultTitle">預約結果</h2>
        <button class="btn btn-ghost" id="closeModal" type="button">關閉</button>
      </div>
      <div class="notice" id="resultText"></div>
      <div class="notice warn hidden" id="resultRefund" role="note"></div>
      <img id="resultImage" alt="網站畫面" />
      <div class="sheet-actions" id="resultButtons"></div>
    </div>
  </div>
  <div id="historyModal" class="overlay hidden">
    <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <div class="history-head">
        <h2 id="historyTitle">歷史紀錄</h2>
        <button class="btn btn-ghost" id="closeHistory" type="button">關閉</button>
      </div>
      <div class="muted" id="historyScope" style="font-size:12px"></div>
      <div class="history-section">開搶統計（近 30 天）</div>
      <div id="stats"></div>
      <div class="history-section">每一波（秒數為開搶後幾秒）</div>
      <div id="runs"></div>
      <div class="history-section">
        <span>事件（近 7 天）</span>
        <div class="seg" id="eventFilter">
          <button type="button" class="active" data-filter="key">重要</button>
          <button type="button" data-filter="all">全部</button>
        </div>
      </div>
      <div id="eventList"></div>
    </div>
  </div>
  <div class="toast-box" id="toasts"></div>

  <script>
    const ANY = "";
    const WEEK = "日一二三四五六";
    const DAYS = "一二三四五六日";
    const PHASES = [
      { key: "armed", label: "已設定" },
      { key: "ready", label: "待命" },
      { key: "firing", label: "搶訂中" },
      { key: "done", label: "完成" },
    ];
    const state = {
      meta: null, venue: null, account: "", category: "", date: "", from: "", to: "",
      courts: [], board: null, boardAbort: null, boardSerial: 0, release: null, events: null, shownGrab: 0, snipe: null,
      routine: null,
      watch: null, locked: false,
    };
    const $ = (id) => document.getElementById(id);
    const json = (body) => ({ method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([key, value]) => {
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else if (key.startsWith("on")) node[key] = value;
        else if (key === "dataset") Object.assign(node.dataset, value);
        else node.setAttribute(key, value);
      });
      [].concat(children).filter(Boolean).forEach((child) => node.append(child));
      return node;
    }

    function toast(text, kind = "") {
      const node = el("div", { class: "toast " + kind, text });
      $("toasts").append(node);
      setTimeout(() => node.remove(), kind === "error" ? 6000 : 3500);
    }

    function busy(text) {
      $("busyText").textContent = text || "處理中…";
      $("busy").classList.toggle("hidden", !text);
    }

    function isoDate(day) {
      return `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
    }

    function target(extra = {}) {
      return { venue: state.venue.id, account: state.account, ...extra };
    }

    function query(extra = {}) {
      return "?" + new URLSearchParams(target(extra)).toString();
    }

    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok || data.ok === false) throw new Error(data.error || data.message || "失敗");
      return data;
    }

    function localGet(key) {
      try { return localStorage.getItem("sportflex." + key); } catch { return null; }
    }

    function localSet(key, value) {
      try { localStorage.setItem("sportflex." + key, value); } catch { /* private mode */ }
    }

    const fmt = (minutes) => `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}`;
    const toMinutes = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };

    // ---- venue / account ---------------------------------------------

    async function loadMeta() {
      state.meta = await api("/api/meta");
      if (state.meta.instance) {
        const pill = $("instancePill");
        pill.textContent = "這台 " + state.meta.instance;
        pill.classList.remove("hidden");
        $("loginTitle").textContent = `這個帳號尚未登入。Telegram 請回覆 [${state.meta.instance} · …] 開頭的那張驗證碼`;
      }
      const venues = $("venueSelect");
      venues.replaceChildren(...state.meta.venues.map((venue) =>
        el("option", { value: venue.id, text: venue.name })));
      const saved = localGet("venue");
      if (saved && state.meta.venues.some((venue) => venue.id === saved)) venues.value = saved;
      await selectVenue(venues.value);
    }

    async function selectVenue(id) {
      state.venue = state.meta.venues.find((venue) => venue.id === id);
      localSet("venue", id);
      state.category = state.venue.categories[0];
      state.date = "";
      const accounts = $("accountSelect");
      accounts.replaceChildren(...state.meta.accounts
        .filter((account) => account.provider === state.venue.provider)
        .map((account) => el("option", { value: account.id, text: account.label + (account.ready ? "" : "（無法使用）") })));
      const saved = localGet("account");
      if (saved && [...accounts.options].some((option) => option.value === saved)) accounts.value = saved;
      state.account = accounts.value;
      const info = state.venue.info || {};
      $("venueInfo").textContent = [state.venue.name, info.hours].filter(Boolean).join(" · ");
      renderRuleChips();
      renderSports();
      state.courts = [];
      renderWeekdays([]);
      renderRoutineTargets([{ courtId: ANY, time: preferredTime("20:00") }]);
      renderTargets([{ courtId: ANY, time: preferredTime("19:00") }]);
      await refreshAll();
    }

    async function selectAccount(id) {
      state.account = id;
      localSet("account", id);
      await refreshAll();
    }

    async function refreshAll() {
      subscribe();
      loadRelease();
      await loadSession();
      await loadCourts();
      await loadRoutine();
      await loadBoard();
    }

    // ---- session -----------------------------------------------------

    function showSession(data) {
      const pill = $("sessionPill");
      pill.classList.toggle("on", !!data.loggedIn);
      pill.classList.toggle("off", !data.loggedIn);
      $("sessionText").textContent = data.loggedIn ? `已登入 ${data.account.username}` : "尚未登入";
      $("loginBox").classList.toggle("hidden", !!data.loggedIn);
    }

    async function loadSession() {
      try {
        showSession(await api("/api/session" + query()));
      } catch (error) {
        $("sessionText").textContent = error.message;
      }
    }

    // ---- release & rules ---------------------------------------------

    function renderRuleChips() {
      const rules = state.venue.rules;
      const chips = [
        `可訂 ${rules.window_days} 天內`,
        `每天 ${rules.release_time} 開放`,
        `每次 ${rules.slot_hours} 小時`,
        `每日上限 ${rules.max_hours_per_day} 小時`,
      ];
      if (rules.distinct_courts) chips.push("須不同場");
      $("ruleChips").replaceChildren(...chips.map((text) => el("span", { class: "rule-chip", text })));
      $("watchUntilFullText").textContent = `訂到當天上限（${rules.max_hours_per_day} 小時）才停`;
      refreshWatchHint();
    }

    async function loadRelease() {
      try {
        state.release = await api("/api/release?venue=" + encodeURIComponent(state.venue.id));
        $("targetLabel").textContent = state.release.targetLabel;
        $("opensLabel").textContent = `${state.release.opensLabel} 開放`;
        tickCountdown();
      } catch (error) {
        toast(error.message, "error");
      }
    }

    function syncPageLock() {
      const data = state.snipe;
      const lead = ((state.venue && state.venue.rules.prepare_lead_sec) || 60) * 1000;
      const opensAt = state.release ? Date.parse(state.release.opensAt) : NaN;
      const phase = data && data.phase;
      const near = !!(data && data.running && Number.isFinite(opensAt) && opensAt - Date.now() < lead);
      state.locked = ["preparing", "ready", "firing"].includes(phase) || near;
      $("boardLock").classList.toggle("hidden", !state.locked);
      $("reload").disabled = state.locked;
    }

    function tickCountdown() {
      syncPageLock();
      if (!state.release) return;
      const remain = new Date(state.release.opensAt) - Date.now();
      const node = $("countdown");
      node.classList.toggle("live", remain <= 0);
      if (remain <= 0) {
        node.textContent = "開放中";
        if (remain < -5000) loadRelease();
        return;
      }
      const total = Math.floor(remain / 1000);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      node.textContent = [hours, minutes, seconds].map((part) => String(part).padStart(2, "0")).join(":");
    }

    // ---- targets -----------------------------------------------------

    function maxTargets() {
      const rules = state.venue.rules;
      return Math.max(1, Math.floor(rules.max_hours_per_day / rules.slot_hours));
    }

    function bookingBounds() {
      const rules = state.venue.rules;
      const length = Math.round(rules.slot_hours * 60);
      const open = toMinutes(rules.open_time);
      const close = toMinutes(rules.close_time);
      const step = rules.align_minutes;
      const remainder = open % step;
      const first = remainder ? open + (step - remainder) : open;
      return { first, close, length, step, last: close - length };
    }

    function timeOptions() {
      const { first, close, length, step } = bookingBounds();
      const options = [];
      for (let start = first; start + length <= close; start += step) {
        options.push({ value: fmt(start), label: `${fmt(start)}–${fmt(start + length)}` });
      }
      return options;
    }

    function preferredTime(want) {
      const bounds = bookingBounds();
      const minute = toMinutes(want);
      if (minute >= bounds.first && minute <= bounds.last && minute % bounds.step === 0) return want;
      const clamped = Math.min(Math.max(minute, bounds.first), bounds.last);
      const aligned = clamped - (clamped % bounds.step);
      return fmt(aligned >= bounds.first ? aligned : bounds.first);
    }

    function readTargetRows(box) {
      return [...box.querySelectorAll(".target")].map((row) => ({
        courtId: row.querySelector(".t-court").value,
        name: row.querySelector(".t-court").selectedOptions[0]?.textContent || "",
        time: row.querySelector(".t-time").value,
      }));
    }

    function readTargets() {
      return readTargetRows($("targets")).map((row) => ({ courtId: row.courtId, time: row.time }));
    }

    function renderTargetRows(box, rows, onRemove) {
      const times = timeOptions();
      box.replaceChildren(...rows.map((row, index) => {
        const known = state.courts.some((item) => item.id === row.courtId);
        const court = el("select", { class: "field t-court", "aria-label": `目標 ${index + 1} 場地` }, [
          el("option", { value: ANY, text: "任一場" }),
          ...state.courts.map((item) => el("option", { value: item.id, text: item.name })),
          row.courtId && !known ? el("option", { value: row.courtId, text: row.name || row.courtId }) : null,
        ]);
        court.value = [...court.options].some((option) => option.value === row.courtId) ? row.courtId : ANY;
        const time = el("select", { class: "field t-time", "aria-label": `目標 ${index + 1} 時間` },
          times.map((item) => el("option", { value: item.value, text: item.label })));
        if (times.some((item) => item.value === row.time)) time.value = row.time;
        const remove = rows.length > 1
          ? el("button", { class: "remove", type: "button", title: "移除", "aria-label": "移除", text: "×", onclick: () => onRemove(index) })
          : el("span");
        return el("div", { class: "target" }, [el("span", { class: "target-no", text: String(index + 1) }), court, time, remove]);
      }));
    }

    function renderTargets(rows) {
      renderTargetRows($("targets"), rows, (index) => {
        const next = readTargets();
        next.splice(index, 1);
        renderTargets(next);
      });
      $("addTarget").classList.toggle("hidden", rows.length >= maxTargets());
      const rules = state.venue.rules;
      const share = "和其他帳號同時搶時，會自動錯開到不同場或不同時段。";
      $("targetHint").textContent = (rules.distinct_courts && rows.length > 1
        ? "選「任一場」時會自動避開其他目標用到的場地。"
        : "「任一場」會在開放瞬間用時段篩選找出所有空場，搶第一個有空的。") + share;
    }

    // ---- weekly routine -----------------------------------------------

    function renderWeekdays(selected) {
      const picked = new Set(selected || []);
      $("weekdays").replaceChildren(...[...DAYS].map((label, index) => {
        const button = el("button", {
          type: "button",
          class: "wd-btn" + (picked.has(index) ? " on" : ""),
          text: label,
          "aria-pressed": picked.has(index) ? "true" : "false",
          "aria-label": "週" + label,
        });
        button.dataset.day = String(index);
        button.onclick = () => {
          const on = !button.classList.contains("on");
          button.classList.toggle("on", on);
          button.setAttribute("aria-pressed", on ? "true" : "false");
        };
        return button;
      }));
    }

    function readWeekdays() {
      return [...$("weekdays").querySelectorAll("button.on")].map((button) => Number(button.dataset.day));
    }

    function renderRoutineTargets(rows) {
      renderTargetRows($("routineTargets"), rows, (index) => {
        const next = readTargetRows($("routineTargets"));
        next.splice(index, 1);
        renderRoutineTargets(next);
      });
      $("addRoutineTarget").classList.toggle("hidden", rows.length >= maxTargets());
    }

    function routineStatusText(data) {
      if (!data || !data.enabled) return "選星期和時段後套用。之後每天開放前會自動排上第 14 天，不必再每天設一次。";
      const release = data.release || {};
      let next = "";
      if (data.skipDate && data.skipDate === release.targetDate) {
        next = `這一波 ${release.targetLabel || ""} 已取消，之後符合的日子仍會自動排。`;
      } else if (data.due) {
        next = `下一波 ${release.targetLabel || ""} 會在 ${release.opensLabel || ""} 前自動排好。`;
      } else {
        next = `下一波 ${release.targetLabel || ""} 不是選定的星期，到了會再排。`;
      }
      return `已套用：${data.label}。${next}`;
    }

    function showRoutine(data, fill) {
      if (!data) return;
      state.routine = data;
      $("routineStatus").textContent = routineStatusText(data);
      $("routineOff").classList.toggle("hidden", !data.enabled);
      if (!fill) return;
      renderWeekdays(data.weekdays || []);
      renderRoutineTargets((data.targets && data.targets.length) ? data.targets : [{ courtId: ANY, time: preferredTime("20:00") }]);
    }

    async function loadRoutine() {
      try {
        showRoutine(await api("/api/routine" + query()), true);
      } catch (error) {
        toast(error.message, "error");
      }
    }

    function namedTargets(rows) {
      return rows.map((row) => ({
        courtId: row.courtId,
        time: row.time,
        name: row.courtId ? (state.courts.find((item) => item.id === row.courtId) || {}).name || row.name || row.courtId : "任一場",
      }));
    }

    async function saveRoutine() {
      const weekdays = readWeekdays();
      if (!weekdays.length) {
        toast("請至少選一個星期", "error");
        return;
      }
      const named = namedTargets(readTargetRows($("routineTargets")));
      const days = weekdays.map((day) => "週" + DAYS[day]).join("、");
      const lines = named.map((row) => `・${row.name} ${row.time}`).join("\n");
      const who = $("accountSelect").selectedOptions[0]?.textContent || state.account;
      if (!confirm(`用「${who}」設定每週固定\n${state.venue.name} ${state.category}\n${days}\n${lines}\n\n之後凡是這些星期，都會在當天 ${state.venue.rules.release_time} 開放前自動排上第 ${state.venue.rules.window_days} 天。付款仍要自己完成。`)) return;
      try {
        showRoutine(await api("/api/routine", json(target({
          enabled: true, category: state.category, weekdays, targets: named,
        }))), true);
        toast("已套用每週固定。符合的日子會在開放前自動排好");
        loadJobs();
      } catch (error) {
        toast(error.message, "error");
      }
    }

    async function clearRoutine() {
      if (!confirm("停用每週固定？已排上、還沒開搶的這一波也會取消。")) return;
      try {
        showRoutine(await api("/api/routine", json(target({ enabled: false }))), true);
        toast("已停用每週固定");
        loadJobs();
      } catch (error) {
        toast(error.message, "error");
      }
    }

    // ---- snipe -------------------------------------------------------

    async function startSnipe() {
      const named = namedTargets(readTargets());
      const lines = named.map((row) => `・${row.name} ${row.time}`).join("\n");
      const who = $("accountSelect").selectedOptions[0]?.textContent || state.account;
      if (!confirm(`用「${who}」搶 ${state.venue.name}\n${state.release.targetLabel} ${state.category}\n${lines}\n\n${state.release.opensLabel} 看到空檔就送出訂單（訂單成立），付款仍要你自己完成。`)) return;
      try {
        showSnipe(await api("/api/snipe", json(target({ enabled: true, category: state.category, targets: named }))));
        toast("已設定搶訂，請保持程式開著");
        loadJobs();
      } catch (error) {
        toast(error.message, "error");
      }
    }

    async function cancelSnipe() {
      if (state.snipe?.running) {
        const text = state.snipe.source === "routine"
          ? "取消這一波？每週固定還在，之後符合的日子仍會自動排。這一波不會再自動排上。"
          : "取消這次搶訂？";
        if (!confirm(text)) return;
      }
      try {
        showSnipe(await api("/api/snipe", json(target({ enabled: false }))));
        loadJobs();
      } catch (error) {
        toast(error.message, "error");
      }
    }

    function showSnipe(data) {
      state.snipe = data;
      const running = data.running;
      const showRun = running || data.phase === "done";
      $("setupBox").classList.toggle("hidden", showRun && running);
      $("runBox").classList.toggle("hidden", !showRun);
      $("cancelBtn").textContent = running ? "取消搶訂" : "清除結果";
      if (showRun) {
        const phase = data.phase === "preparing" ? "ready" : data.phase === "need_login" ? "armed" : data.phase;
        const current = PHASES.findIndex((item) => item.key === phase);
        $("stepper").replaceChildren(...PHASES.map((item, index) => el("div", {
          class: "step" + (index < current ? " done" : index === current ? " current" : ""),
        }, [el("div", { class: "step-bar" }), el("span", { text: item.label })])));
        const alertBox = $("runAlert");
        alertBox.classList.toggle("hidden", data.phase !== "need_login");
        alertBox.textContent = "登入已失效，請在上方輸入驗證碼重新登入，否則無法搶訂。";
        const note = $("runNote");
        const weekly = data.source === "routine" && running;
        note.classList.toggle("hidden", !weekly);
        note.textContent = weekly ? "這一波是每週固定自動排上的。" : "";
        $("runTargets").replaceChildren(...(data.targets || []).map((item) => {
          const badge = item.status === "booked"
            ? el("span", { class: "badge ok", text: `已送出${item.bookedName ? " · " + item.bookedName : ""}` })
            : item.status === "skipped" ? el("span", { class: "badge skip", text: "略過" })
            : el("span", { class: "badge", text: running ? "等待中" : "未搶到" });
          const origin = item.fromTime && (item.fromTime !== item.time || (item.fromName && item.fromName !== item.name))
            ? `（原 ${item.fromName || item.name} ${item.fromTime}）` : "";
          return el("div", { class: "tstatus" }, [el("span", { text: `${item.name} · ${item.time}${origin}` }), badge]);
        }));
      }
      if (data.phase === "need_login") $("loginBox").classList.remove("hidden");
      syncPageLock();
      const lines = data.log || [];
      $("log").textContent = lines.join("\n") || "還沒有紀錄。";
      if (running) $("logBox").open = true;
    }

    function showGrab(grabbed) {
      if (grabbed && grabbed.at && grabbed.at !== state.shownGrab) {
        state.shownGrab = grabbed.at;
        showResult(grabbed);
      }
    }

    function subscribe() {
      if (state.events) state.events.close();
      state.events = new EventSource("/api/events" + query());
      state.events.onmessage = (event) => {
        const data = JSON.parse(event.data);
        showSnipe(data.snipe);
        if (data.routine) showRoutine(data.routine);
        showWatch(data.watch);
        showSession(data.session);
        showGrab(data.lastGrab);
      };
      loadJobs();
    }

    async function loadJobs() {
      try {
        const data = await api("/api/snipes");
        const others = data.snipes.filter((job) => job.running && !(job.venue === state.venue.id && job.account === state.account));
        const who = (id) => state.meta?.accounts.find((item) => item.id === id)?.label || id;
        const line = (job) => {
          const targets = (job.targets || []).map((item) => `${item.name} ${item.time}`).join("、");
          return `${who(job.account)} ${job.release.targetLabel} ${targets}`.trim();
        };
        $("jobs").textContent = others.length ? "其他進行中的搶訂：" + others.map(line).join("、") : "";
      } catch { /* optional */ }
    }

    // ---- board -------------------------------------------------------

    function renderSports() {
      $("sports").replaceChildren(...state.venue.categories.map((name) => el("button", {
        type: "button", role: "tab", class: name === state.category ? "active" : "", text: name,
        onclick: () => {
          state.category = name;
          renderSports();
          loadCourts();
          loadBoard();
        },
      })));
    }

    function renderDates(start, end, current) {
      const box = $("dates");
      box.replaceChildren();
      if (!start || !end) return;
      const day = new Date(start + "T00:00:00");
      const last = new Date(end + "T00:00:00");
      const today = isoDate(new Date());
      while (day <= last) {
        const iso = isoDate(day);
        const weekday = day.getDay();
        const label = iso === today ? "今天" : "週" + WEEK[weekday];
        box.append(el("button", {
          type: "button",
          class: "date" + (iso === current ? " active" : "") + (weekday === 0 || weekday === 6 ? " weekend" : ""),
          onclick: () => { state.date = iso; loadBoard(); },
        }, [el("span", { class: "wd", text: label }), el("span", { class: "md", text: `${day.getMonth() + 1}/${day.getDate()}` })]));
        day.setDate(day.getDate() + 1);
      }
      box.querySelector(".active")?.scrollIntoView({ block: "nearest", inline: "center" });
    }

    function inWindow(time) {
      const begin = time.split("-")[0].trim();
      if (state.from && begin < state.from) return false;
      if (state.to && begin >= state.to) return false;
      return true;
    }

    function boardRows() {
      const data = state.board;
      const seen = new Set();
      const rows = (data.order || []).map((court) => {
        seen.add(court.id);
        return data.loaded[court.id] || { ...court, pending: true };
      });
      Object.values(data.loaded || {}).forEach((court) => {
        if (!seen.has(court.id)) rows.push(court);
      });
      return rows;
    }

    function slotCell(court, slot) {
      if (!slot) return el("td", {}, el("span", { class: "cell none", text: "·" }));
      if (slot.mine) return el("td", {}, el("span", { class: "cell mine", title: "這面這個時段已經是你的", text: "我的" }));
      if (!slot.bookable) return el("td", {}, el("span", { class: "cell taken", title: slot.status || "已被預約", text: "—" }));
      if (state.locked) return el("td", {}, el("span", { class: "cell taken", title: "開搶中，先不要手動搶", text: "搶" }));
      return el("td", {}, el("button", {
        type: "button", class: "cell", title: `搶 ${court.name} ${slot.time}`,
        onclick: () => grab(court, slot),
      }, [el("span", { text: "搶" }), el("small", { text: `$${slot.price}` })]));
    }

    function renderBoard() {
      const board = $("board");
      const status = $("boardStatus");
      const data = state.board;
      if (!data || !data.order.length) {
        status.textContent = "";
        board.replaceChildren(el("div", { class: "empty", text: `${state.category}沒有可查的場地` }));
        return;
      }
      const rows = boardRows();
      const loaded = rows.filter((court) => !court.pending);
      const starts = [...new Set(loaded.flatMap((court) => (court.slots || []).map((slot) => slot.time.split("-")[0].trim())))]
        .filter((start) => inWindow(start))
        .sort();
      const waiting = rows.length - loaded.length;
      status.textContent = waiting
        ? `已查出 ${loaded.length}/${rows.length} 面${data.failed ? "，後面的查詢中斷" : "，其餘繼續查"}`
        : "";
      if (!starts.length && !waiting) {
        board.replaceChildren(el("div", { class: "empty", text: "這個時段沒有資料" }));
        return;
      }
      const head = el("tr", {}, [
        el("th", { class: "court-col", text: "場地" }),
        ...starts.map((start) => el("th", { text: start })),
      ]);
      const body = rows.map((court) => {
        if (court.pending || !court.slots) {
          const label = data.failed ? "查詢中斷" : "查詢中";
          return el("tr", {}, [
            el("th", { class: "court-col" }, [
              el("div", { class: "court-name", text: court.name }),
              el("div", { class: "court-meta", text: label }),
            ]),
            ...(starts.length
              ? starts.map(() => el("td", {}, el("span", { class: "cell pending", text: "" })))
              : [el("td", {}, el("span", { class: "court-meta", text: label }))]),
          ]);
        }
        const byStart = Object.fromEntries(court.slots.map((slot) => [slot.time.split("-")[0].trim(), slot]));
        const open = court.slots.filter((slot) => slot.bookable && inWindow(slot.time)).length;
        return el("tr", {}, [
          el("th", { class: "court-col" }, [
            el("div", { class: "court-name", text: court.name }),
            el("div", { class: "court-meta", text: open ? `${open} 個空檔` : "已滿" }),
          ]),
          ...(starts.length
            ? starts.map((start) => slotCell(court, byStart[start]))
            : [el("td")]),
        ]);
      });
      board.replaceChildren(el("div", { class: "grid-wrap" }, el("table", { class: "grid" }, [el("thead", {}, head), el("tbody", {}, body)])));
    }

    function applyBoardEvent(event) {
      if (event.type === "meta") {
        state.board = { window: event.window, order: event.courts || [], loaded: {}, failed: false, windowKey: "" };
        renderBoard();
        return;
      }
      if (event.type === "court") {
        if (!state.board) state.board = { window: event.window, order: [], loaded: {}, failed: false, windowKey: "" };
        state.board.window = event.window;
        state.board.loaded[event.court.id] = event.court;
        if (!state.board.order.some((court) => court.id === event.court.id)) state.board.order.push(event.court);
        if (event.window.date) state.date = event.window.date;
        const key = `${event.window.start}|${event.window.end}|${event.window.date}`;
        if (event.window.start && key !== state.board.windowKey) {
          state.board.windowKey = key;
          renderDates(event.window.start, event.window.end, state.date);
        }
        renderBoard();
        return;
      }
      if (event.type === "error") {
        toast(event.error, "error");
        if (!state.board) {
          $("boardStatus").textContent = "";
          $("board").replaceChildren(el("div", { class: "empty", text: event.error }));
          return;
        }
        state.board.failed = true;
        renderBoard();
      }
    }

    const BOARD_CACHE_MS = 30000;
    const boardCache = new Map();
    let boardFlight = null;

    function boardCacheKey(date) {
      return [state.venue.id, state.account, state.category, date || ""].join("\0");
    }

    function boardReady(board) {
      if (!board || board.failed || !board.order) return false;
      return board.order.every((court) => board.loaded && board.loaded[court.id] && board.loaded[court.id].slots);
    }

    function cachedBoard(date) {
      const key = boardCacheKey(date);
      const hit = boardCache.get(key);
      if (!hit) return null;
      if (Date.now() - hit.at >= BOARD_CACHE_MS) {
        boardCache.delete(key);
        return null;
      }
      return hit;
    }

    function rememberBoard(requestDate, ageMs) {
      if (!boardReady(state.board)) return;
      const at = Date.now() - (Number(ageMs) || 0);
      if (Date.now() - at >= BOARD_CACHE_MS) return;
      const entry = {
        at,
        date: state.date || requestDate || "",
        board: structuredClone(state.board),
      };
      boardCache.set(boardCacheKey(requestDate), entry);
      if (!requestDate && entry.date) boardCache.set(boardCacheKey(entry.date), entry);
    }

    function forgetBoard(date) {
      const hit = boardCache.get(boardCacheKey(date));
      if (!hit) return;
      for (const [key, entry] of boardCache) {
        if (entry === hit) boardCache.delete(key);
      }
    }

    function showCachedBoard(entry) {
      state.board = structuredClone(entry.board);
      if (entry.date) state.date = entry.date;
      const window = state.board.window || {};
      if (window.start && window.end) renderDates(window.start, window.end, state.date || window.date || "");
      $("boardStatus").textContent = "";
      renderBoard();
    }

    function stopBoardFlight() {
      ++state.boardSerial;
      if (state.boardAbort) state.boardAbort.abort();
      state.boardAbort = null;
      boardFlight = null;
    }

    async function loadBoard(options = {}) {
      const fresh = options.fresh === true;
      const requestDate = state.date;
      const key = boardCacheKey(requestDate);
      if (!fresh) {
        const hit = cachedBoard(requestDate);
        if (hit) {
          stopBoardFlight();
          showCachedBoard(hit);
          return;
        }
        if (boardFlight && boardFlight.key === key && boardFlight.serial === state.boardSerial) return;
      }

      if (fresh) forgetBoard(requestDate);
      const serial = ++state.boardSerial;
      if (state.boardAbort) state.boardAbort.abort();
      const abort = new AbortController();
      state.boardAbort = abort;
      boardFlight = { key, serial };
      state.board = null;
      $("boardStatus").textContent = "";
      $("board").replaceChildren(el("div", { class: "grid-wrap" }, [1, 2, 3, 4].map(() => el("div", { class: "skeleton" }))));
      let cacheAgeMs = 0;
      try {
        const extra = { category: state.category, date: requestDate };
        if (fresh) extra.fresh = "1";
        const response = await fetch("/api/board/stream" + query(extra), { signal: abort.signal });
        if (!response.ok) {
          let message = "查詢失敗";
          try {
            const data = await response.json();
            message = data.error || message;
          } catch { /* not JSON */ }
          throw new Error(message);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (serial === state.boardSerial) {
          const chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const part of parts) {
            const line = part.split("\n").filter((item) => item.startsWith("data:")).map((item) => item.slice(5).trim()).join("\n");
            if (!line || serial !== state.boardSerial) continue;
            const parsed = JSON.parse(line);
            if (parsed.type === "cached") {
              cacheAgeMs = Number(parsed.ageMs) || 0;
              continue;
            }
            applyBoardEvent(parsed);
          }
        }
        if (serial === state.boardSerial) rememberBoard(requestDate, cacheAgeMs);
      } catch (error) {
        if (error.name === "AbortError" || serial !== state.boardSerial) return;
        if (!state.board || !state.board.order.length) {
          $("boardStatus").textContent = "";
          $("board").replaceChildren(el("div", { class: "empty", text: error.message }));
        } else {
          toast(error.message, "error");
        }
      } finally {
        if (boardFlight && boardFlight.serial === serial) boardFlight = null;
      }
    }

    async function loadCourts() {
      try {
        const data = await api("/api/courts" + query({ category: state.category }));
        const rows = readTargets();
        const routineRows = $("routineTargets").querySelector(".target") ? readTargetRows($("routineTargets")) : null;
        state.courts = data.courts;
        renderTargets(rows.length ? rows : [{ courtId: ANY, time: preferredTime("19:00") }]);
        if (routineRows) renderRoutineTargets(routineRows);
      } catch (error) {
        toast(error.message, "error");
      }
    }

    // ---- grab / result -----------------------------------------------

    function slotHours(time) {
      const [start, end] = String(time || "").split("-").map((part) => part.trim());
      const toMin = (value) => {
        const [hour, minute] = (value || "").split(":").map(Number);
        return hour * 60 + (minute || 0);
      };
      const hours = (toMin(end) - toMin(start)) / 60;
      return hours > 0 ? hours : 0;
    }

    function heldHours() {
      const courts = state.board && state.board.loaded ? Object.values(state.board.loaded) : [];
      return courts.reduce((sum, court) => sum + (court.slots || []).filter((slot) => slot.mine).reduce((inner, slot) => inner + slotHours(slot.time), 0), 0);
    }

    function watchUntilFull() {
      return !!$("watchUntilFull").checked;
    }

    function refreshWatchHint(spec) {
      if (!state.venue) return;
      const rules = state.venue.rules;
      const held = heldHours();
      const filling = spec ? !!spec.untilFull && !(spec.targets || []).length : watchUntilFull();
      const where = "用右側目前的日期和上午／下午／晚上。";
      const heldNote = held ? `這天你已訂 ${held} 小時（上限 ${rules.max_hours_per_day}）。` : "";
      const mode = filling
        ? `看到空檔就連續送出，直到這天訂滿 ${rules.max_hours_per_day} 小時才停。`
        : "看到空檔就送出一筆訂單，然後停止。";
      $("watchHint").textContent = [where, heldNote, mode].filter(Boolean).join("");
    }

    async function startWatch() {
      if (!state.date) {
        toast("先選右側的日期", "error");
        return;
      }
      const rules = state.venue.rules;
      const held = heldHours();
      const filling = watchUntilFull();
      if (filling && held + rules.slot_hours > rules.max_hours_per_day) {
        toast(`這天已訂 ${held} 小時，上限 ${rules.max_hours_per_day} 小時`, "error");
        return;
      }
      const windowText = state.from ? `${state.from}–${state.to}` : "全天";
      const who = $("accountSelect").selectedOptions[0]?.textContent || state.account;
      const mode = filling
        ? `看到空檔就送出訂單，直到這天訂滿 ${rules.max_hours_per_day} 小時才停。`
        : "看到空檔就送出一筆訂單，然後停止。";
      if (!confirm(`用「${who}」盯 ${state.venue.name}\n${state.date} ${state.category} ${windowText}\n\n${mode}付款要自己完成。開搶前後會暫停查表，結束後繼續。`)) return;
      try {
        showWatch(await api("/api/watch", json(target({
          enabled: true, category: state.category, date: state.date, timeFrom: state.from, timeTo: state.to, courtId: "",
          untilFull: filling,
        }))));
        toast(state.locked ? "已設定盯場，開搶前後會暫停，結束後繼續" : "已開始盯場");
      } catch (error) {
        toast(error.message, "error");
      }
    }

    async function stopWatch() {
      try {
        showWatch(await api("/api/watch", json(target({ enabled: false }))));
      } catch (error) {
        toast(error.message, "error");
      }
    }

    function watchSummary(spec) {
      const targets = spec.targets || [];
      if (targets.length) {
        const listed = targets.map((item) => `${item.name || "任一場"} ${item.time}`).join("、");
        return [spec.date, listed].filter(Boolean).join(" ");
      }
      const windowText = spec.timeFrom ? `${spec.timeFrom}–${spec.timeTo}` : "全天";
      const court = spec.courtName || (spec.courtId ? "指定場" : "任一場");
      const mode = spec.untilFull ? "訂滿才停" : "";
      return [spec.date, windowText, court, mode].filter(Boolean).join(" ");
    }

    function showWatch(data) {
      if (!data) return;
      state.watch = data;
      const running = !!data.running;
      $("watchStart").classList.toggle("hidden", running);
      $("watchUntilFullLabel").classList.toggle("hidden", running);
      $("watchRun").classList.toggle("hidden", !running);
      const spec = data.spec || {};
      $("watchStatus").textContent = watchSummary(spec);
      $("watchLog").textContent = (data.log || []).slice(-4).join("\n");
      refreshWatchHint(running ? spec : null);
    }

    async function grab(court, slot) {
      if (state.locked) {
        toast("開搶前後暫停手動搶位", "error");
        return;
      }
      const held = heldHours();
      const limit = state.venue.rules.max_hours_per_day;
      if (held + state.venue.rules.slot_hours > limit) {
        toast(`這天已訂 ${held} 小時，上限 ${limit} 小時`, "error");
        return;
      }
      if (!confirm(`搶 ${court.name}\n${state.date}  ${slot.time}\n$${slot.price}\n\n會直接送出訂單（訂單成立），付款由你自己完成。`)) return;
      busy("搶位中…");
      try {
        showResult(await api("/api/grab", json(target({ category: state.category, courtId: court.id, date: state.date, slot }))));
      } catch (error) {
        toast(error.message, "error");
      } finally {
        busy("");
      }
    }

    function showResult(result) {
      $("resultTitle").textContent = [result.court, result.date, result.time].filter(Boolean).join(" · ") || "網站畫面";
      const order = result.order;
      const calendar = result.calendar || null;
      $("resultText").textContent = order
        ? [
            `訂單已成立${order.no ? "：" + order.no : ""}`,
            `請${order.timeoutSec ? ` ${Math.floor(order.timeoutSec / 60)} 分鐘內` : "立即"}付款，逾時會被取消：開「會員中心」→ 點「待付款」→ 前往付款。`,
            order.carrier ? `發票請選「手機載具」，填 ${order.carrier}` : "",
            order.warning ? `注意：${order.warning}` : "",
          ].filter(Boolean).join("\n")
        : "停在訂單確認頁，還沒送出訂單；付款不會自動按。" + (result.url ? `\n${result.url}` : "");
      const refund = $("resultRefund");
      if (calendar && calendar.refund) {
        refund.textContent = "取消規則：" + calendar.refund;
        refund.classList.remove("hidden");
      } else {
        refund.textContent = "";
        refund.classList.add("hidden");
      }
      $("resultImage").src = "data:image/jpeg;base64," + result.image;
      const actions = calendarActions(calendar);
      if (order && order.paymentUrl) {
        $("resultButtons").replaceChildren(el("a", {
          class: "btn btn-primary", href: order.paymentUrl, target: "_blank", rel: "noopener", text: "開啟會員中心（待付款）",
        }), ...actions);
        $("modal").classList.remove("hidden");
        return;
      }
      $("resultButtons").replaceChildren(...actions, ...(result.buttons || [])
        .filter((label) => !["×", "OK", "No", "Cancel"].includes(label))
        .map((label) => {
          const paying = label.includes("付款") || label.includes("支付");
          return el("button", { type: "button", class: "btn " + (paying ? "btn-danger" : "btn-primary"), text: label, onclick: () => press(label) });
        }));
      $("modal").classList.remove("hidden");
    }

    function calendarActions(calendar) {
      if (!calendar) return [];
      const actions = [];
      if (calendar.googleUrl) {
        actions.push(el("a", {
          class: "btn", href: calendar.googleUrl, target: "_blank", rel: "noopener", text: "加入 Google 行事曆",
        }));
      }
      if (calendar.ics) {
        actions.push(el("button", { type: "button", class: "btn", text: "下載 .ics", onclick: () => downloadIcs(calendar) }));
      }
      return actions;
    }

    function downloadIcs(calendar) {
      const blob = new Blob([calendar.ics], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = calendar.filename || "booking.ics";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    async function press(label) {
      const paying = label.includes("付款") || label.includes("支付");
      if (paying && !confirm(`網站要「${label}」。確定繼續？`)) return;
      busy("送出中…");
      try {
        showResult(await api("/api/press", json(target({ label }))));
      } catch (error) {
        toast(error.message, "error");
      } finally {
        busy("");
      }
    }

    // ---- history -----------------------------------------------------

    const RESULT = { booked: ["全搶到", "ok"], partial: ["部分搶到", "part"], missed: ["沒搶到", "miss"] };
    const QUIET_KINDS = new Set(["note", "status"]);
    const secs = (value) => value === null || value === undefined ? "—" : `${value.toFixed(2)}s`;

    async function openHistory() {
      $("historyModal").classList.remove("hidden");
      const account = state.meta.accounts.find((item) => item.id === state.account);
      $("historyScope").textContent = `${state.venue.name} · ${account ? account.label : state.account}`;
      $("stats").replaceChildren(el("div", { class: "skeleton" }));
      $("runs").replaceChildren(el("div", { class: "skeleton" }));
      $("eventList").replaceChildren(el("div", { class: "skeleton" }));
      try {
        const [runs, history, stats] = await Promise.all([
          api("/api/snipe-runs" + query({ days: 30 })),
          api("/api/history" + query({ days: 7, limit: 300 })),
          api("/api/snipe-stats" + query({ days: 30 })),
        ]);
        state.history = history.events;
        renderStats(stats.stats);
        renderRuns(runs.runs);
        renderEvents();
      } catch (error) {
        $("stats").replaceChildren(el("p", { class: "stats-empty", text: error.message }));
        $("runs").replaceChildren(el("div", { class: "empty", text: error.message }));
        $("eventList").replaceChildren();
      }
    }

    const pct = (rate) => rate === null || rate === undefined ? "—" : `${Math.round(rate * 100)}%`;
    const secText = (value) => value === null || value === undefined ? "" : `${Number(value).toFixed(2)}s`;

    function renderStats(stats) {
      if (!stats || !stats.waves.total) {
        $("stats").replaceChildren(el("p", {
          class: "stats-empty",
          text: "還沒有開搶紀錄。第一波之後這裡會列出命中率、平均幾秒釋出，以及哪一面場最好搶。",
        }));
        return;
      }
      const release = stats.release;
      const cards = [
        ["目標命中率", pct(stats.targets.hitRate), targetSub(stats.targets)],
        ["至少搶到一張", pct(stats.waves.hitRate), waveSub(stats.waves)],
        ["平均幾秒釋出", release.avgSec == null ? "—" : secText(release.avgSec), releaseSub(release)],
      ];
      const grid = el("div", { class: "stats" }, cards.map(([label, value, sub]) => el("div", { class: "stat" }, [
        el("div", { class: "stat-label", text: label }),
        el("div", { class: "stat-value", text: value }),
        el("div", { class: "stat-sub", text: sub }),
      ])));
      const children = [grid, el("p", { class: "stat-note", text: offsetNote(stats) })];
      const courts = renderCourtStats(stats);
      if (courts) children.push(courts);
      $("stats").replaceChildren(...children);
    }

    function targetSub(targets) {
      if (!targets.tried) return "還沒有指定場地的目標";
      const skipped = targets.skipped ? `，${targets.skipped} 個因規定略過` : "";
      return `${targets.booked}/${targets.tried} 個時段${skipped}`;
    }

    function waveSub(waves) {
      if (!waves.fired) return `${waves.total} 波都在開搶前結束`;
      return `有開始查的 ${waves.fired} 波裡 ${waves.landed} 波有搶到，${waves.full} 波全搶到`;
    }

    function releaseSub(release) {
      if (!release.count) return "還沒看到網站釋出";
      return `中位數 ${secText(release.medianSec)} · 最快 ${secText(release.minSec)} · 最慢 ${secText(release.maxSec)} · ${release.count} 波`;
    }

    function offsetNote(stats) {
      const offset = stats.offsetSec;
      const have = stats.release.count;
      const need = stats.offsetMinSamples || 3;
      if (offset == null) {
        const seen = stats.offsetSamples || have;
        return seen
          ? `只看到 ${seen} 波釋出，還不到 ${need} 波，第一次查詢仍在開搶當下送出。`
          : "還沒有看過網站釋出的時間，第一次查詢會在開搶當下送出。";
      }
      const scope = stats.offsetScope === "venue" ? `這個帳號樣本不夠，改用整館 ${stats.offsetSamples} 波。` : "";
      if (Math.abs(offset) < 0.05) return `${scope}釋出時間的中位數接近開搶當下，第一次查詢維持在開搶當下送出。`.trim();
      const when = offset > 0 ? `開搶後 ${offset.toFixed(2)} 秒` : `開搶前 ${Math.abs(offset).toFixed(2)} 秒`;
      return `${scope}第一次查詢會在${when}送出，對齊中位數釋出時間。查太早會被當成還沒開放，然後多等一輪。`.trim();
    }

    function renderCourtStats(stats) {
      const ranked = (stats.courts || []).filter((court) => court.tried);
      const any = stats.anyCourts || [];
      if (!ranked.length && !any.length) return null;
      const best = ranked.length >= 2 ? ranked[0].courtId : "";
      const rows = ranked.map((court) => {
        const speed = court.avgSeenSec == null ? "" : ` · 看到 ${secText(court.avgSeenSec)}`;
        return el("div", { class: "court-row" }, [
          el("span", {}, [
            court.name,
            court.courtId === best ? el("span", { class: "badge ok", text: "最好搶", style: "margin-left:8px" }) : null,
          ]),
          el("span", { class: "mono", text: `${court.booked}/${court.tried}（${pct(court.hitRate)}）${speed}` }),
        ]);
      });
      if (any.length) {
        const text = any.map((court) => `${court.name} ×${court.booked}`).join("、");
        rows.push(el("div", { class: "court-row" }, [
          el("span", { text: "任一場搶到" }),
          el("span", { class: "mono", text: `${text}（不計入上面的命中率）` }),
        ]));
      }
      return el("div", { class: "court-list" }, rows);
    }

    function renderRuns(runs) {
      if (!runs.length) {
        $("runs").replaceChildren(el("div", { class: "empty", text: "還沒有開搶紀錄" }));
        return;
      }
      $("runs").replaceChildren(...runs.map((run) => {
        const [label, tone] = RESULT[run.result] || [run.result, ""];
        return el("div", { class: "run" }, [
          el("div", { class: "run-top" }, [
            el("span", { class: "run-date", text: `${run.target_date} 場次 · ${run.opens_at.slice(5, 10).replace("-", "/")} ${run.opens_at.slice(11, 16)} 開搶` }),
            el("span", { class: `badge ${tone}`, text: `${label} ${run.booked}/${run.total}` }),
          ]),
          el("div", { class: "run-times" }, [
            ["開始查", run.fired_sec], ["釋出", run.released_sec], ["首張到確認頁", run.first_booked_sec], ["結束", run.finished_sec],
          ].map(([name, value]) => el("span", {}, [`${name} `, el("b", { text: secs(value) })]))),
          ...run.targets.map((item) => el("div", { class: "run-target" }, [
            el("span", { text: `${item.bookedName || item.name || "任一場"} · ${item.time}` }),
            el("span", {
              class: "mono",
              text: item.status === "booked"
                ? `看到 ${secs(item.seenSec)} → 確認頁 ${secs(item.bookedSec)}（送出 ${secs(item.submitSec)}）· 查 ${item.attempts || 0} 次`
                : `${item.status === "skipped" ? "略過" : "未搶到"} · 查 ${item.attempts || 0} 次`,
            }),
          ])),
          run.reason ? el("div", { class: "muted", style: "font-size:12px;margin-top:6px", text: run.reason }) : null,
        ]);
      }));
    }

    function renderEvents() {
      const all = document.querySelector("#eventFilter .active").dataset.filter === "all";
      const events = (state.history || []).filter((event) => all || !QUIET_KINDS.has(event.kind));
      if (!events.length) {
        $("eventList").replaceChildren(el("div", { class: "empty", text: "沒有事件" }));
        return;
      }
      $("eventList").replaceChildren(...events.map((event) => el("div", { class: `ev ${event.level}` }, [
        el("span", { class: "ev-at", text: event.at.slice(5, 19).replace("T", " ") }),
        el("span", {}, [el("span", { class: "ev-msg", text: event.message }), el("span", { class: "ev-kind", text: event.job ? `${event.job}·${event.kind}` : event.kind })]),
      ])));
    }

    // ---- wiring ------------------------------------------------------

    $("historyBtn").onclick = openHistory;
    $("closeHistory").onclick = () => $("historyModal").classList.add("hidden");
    $("historyModal").onclick = (event) => { if (event.target === $("historyModal")) $("historyModal").classList.add("hidden"); };
    document.querySelectorAll("#eventFilter button").forEach((button) => {
      button.onclick = () => {
        document.querySelectorAll("#eventFilter button").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        renderEvents();
      };
    });

    document.querySelectorAll("#periods button").forEach((button) => {
      button.onclick = () => {
        document.querySelectorAll("#periods button").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        state.from = button.dataset.from;
        state.to = button.dataset.to;
        if (state.board) renderBoard();
      };
    });
    $("venueSelect").onchange = (event) => selectVenue(event.target.value);
    $("accountSelect").onchange = (event) => selectAccount(event.target.value);
    $("reload").onclick = () => loadBoard({ fresh: true });
    function nextStart(lastTime, fallback) {
      if (!lastTime) return preferredTime(fallback);
      const { length, last } = bookingBounds();
      return preferredTime(fmt(Math.min(toMinutes(lastTime) + length, last)));
    }

    $("addTarget").onclick = () => {
      const rows = readTargets();
      const last = rows[rows.length - 1];
      renderTargets([...rows, { courtId: ANY, time: nextStart(last && last.time, "19:00") }]);
    };
    $("addRoutineTarget").onclick = () => {
      const rows = readTargetRows($("routineTargets"));
      const last = rows[rows.length - 1];
      renderRoutineTargets([...rows, { courtId: ANY, time: nextStart(last && last.time, "20:00") }]);
    };
    $("routineBtn").onclick = saveRoutine;
    $("routineOff").onclick = clearRoutine;
    $("snipeBtn").onclick = startSnipe;
    $("cancelBtn").onclick = cancelSnipe;
    $("watchStart").onclick = startWatch;
    $("watchStop").onclick = stopWatch;
    $("watchUntilFull").onchange = () => refreshWatchHint();
    $("closeModal").onclick = () => $("modal").classList.add("hidden");
    $("modal").onclick = (event) => { if (event.target === $("modal")) $("modal").classList.add("hidden"); };
    $("loadCaptcha").onclick = async () => {
      $("loginMsg").textContent = "讀取驗證碼…";
      try {
        const data = await api("/api/captcha", json(target()));
        $("captcha").src = "data:image/jpeg;base64," + data.image;
        $("captcha").classList.remove("hidden");
        $("loginMsg").textContent = "";
        $("code").focus();
      } catch (error) {
        $("loginMsg").textContent = error.message;
      }
    };
    $("doLogin").onclick = async () => {
      try {
        const data = await api("/api/login", json(target({ code: $("code").value })));
        toast(data.message || "登入成功");
        showSession(data);
        await loadCourts();
        await loadBoard();
      } catch (error) {
        $("loginMsg").textContent = error.message;
      }
    };
    $("code").onkeydown = (event) => { if (event.key === "Enter") $("doLogin").click(); };

    loadMeta().catch((error) => { $("venueInfo").textContent = error.message; });
    setInterval(tickCountdown, 1000);
    setInterval(loadJobs, 15000);
  </script>
</body>
</html>
