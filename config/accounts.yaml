# 帳號清單。密碼不寫在這裡：username_env / password_env 指向 .env 裡的 key。
# 同平台可以放多個帳號（例如家人），每個帳號有自己的瀏覽器 profile 和 worker，可同時搶。
#
#   - id: family
#     provider: changjia
#     label: 家人
#     username_env: SPORT_FLEX_FAMILY_ACCOUNT
#     password_env: SPORT_FLEX_FAMILY_PASSWORD
#     # profile 省略時用 .profiles/<id>
accounts:
  - id: default
    provider: changjia
    label: 我
    username_env: SPORT_FLEX_DEFAULT_ACCOUNT
    password_env: SPORT_FLEX_DEFAULT_PASSWORD
    profile: .browser-profile   # 沿用原本已登入的 profile；之後可搬到 .profiles/default
