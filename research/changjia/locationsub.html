    <script>
        document.addEventListener("DOMContentLoaded", async function() {
        // Get the element with id 'description' and create an iPhone element inside it
        const  descriptionElement = document.getElementById('description');


        const description = "";

        if (description.startsWith('https://')) {
            // Create an iframe element
            const iframe = document.createElement('iframe');
            iframe.src = description; // Use the description URL
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
           
            // Insert the iframe at the beginning of the description element
            descriptionElement.insertBefore(iframe, descriptionElement.firstChild);
        } 

       
       


            // Show loading animation using SweetAlert2
            let loading;
            Swal.fire({
                html: '<img src="../../../assets/gif/loading.gif" style="width: 100px; height: 100px;">',
                allowOutsideClick: false,
                showConfirmButton: false,
                didOpen: () => {
                    // 在彈窗完全開啟後再賦值
                    loading = Swal.getPopup(); // 取得彈窗對象
                }
            });

            try {
            // Call API
                let response = await fetch('../../../api/getRequestData.php ', {
                    method: 'POST',
                    headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        serviceName: "getReservationUrlInfo",
                        LID: "XDSC",
                        LSID: "7F2BBadminton01",
                        infoType: "ReservationRule"
                    })
                });
                let data = await response.json();
                document.querySelector('form#htmlContent_Form input[name="url"]').value = data.ResultData.URL;
                response = await fetch('../../../api/getRequestData.php ', {
                    method: 'POST',
                    headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        serviceName: "getReservationUrlInfo",
                        LID: "XDSC",
                        LSID: "7F2BBadminton01",
                        infoType: "PlaceRule"
                    })
                });
                data = await response.json();
                document.querySelector('form#htmlContent_Form2 input[name="url"]').value = data.ResultData.URL;
            } catch (error) {
                console.error('Error:', error);
            } finally {
                // 確認顯示加載動畫後關閉
                if (loading) {
                    Swal.close();
                }
            }
        });
    </script>
