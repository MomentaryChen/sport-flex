    <script>

        function LineAuth() 
        {
            var URL = 'https://access.line.me/oauth2/v2.1/authorize?';
            URL += 'response_type=code';
            URL += '&client_id=1654161700'; // Note the & before client_id
            URL += '&redirect_uri=https://changjia.sporetrofit.com/login/line/callback.php';
            URL += '&scope=email%20openid%20profile';
            URL += '&state=eyJ0b2tlbiI6ImZkMzJlMzgwNjI4MjZiMjE3Njk1MTA1ODYyN2FhOGZmIiwidmVyaWZ5IjoiYWMxMzY1MWNjM2NhNWMzZTdkZTFkYWM3NDU1YzAzODAifQ==';
            window.open(URL);
        }
        ToggleAddListener();
        function ToggleAddListener(){
            document.querySelectorAll('.toggle-password-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    const targetId = this.getAttribute('data-target');
                    togglePassword(targetId, this);
                });
            });
        }
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
        
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye'); // 變成隱藏圖示
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash'); // 變回顯示圖示
            }
        }
    </script>
