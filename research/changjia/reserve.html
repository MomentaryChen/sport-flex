    function spiltDateStr(dateStr) {
        let parts = dateStr.split("-");

        // 提取年份、月份和日期部分
        let year = parseInt(parts[0], 10);
        let month = parseInt(parts[1], 10) - 1; // 月份需要减1，因为JavaScript中的月份从0开始
        let day = parseInt(parts[2], 10);

        return {
            year,
            month,
            day
        }

    }


    async function getResLocAvailInfo(LID, LSID, dateStr) {
        let loading
        Swal.fire({
            html: '<img src="../../../../assets/gif/loading.gif" style="width: 100px; height: 100px;">',
            allowOutsideClick: false,
            showConfirmButton: false,
            didOpen: () => { // 在彈窗完全開啟後再賦值
                loading = Swal.getPopup(); // 取得彈窗對象
            }
        });


        try {
            let data;
                            data = await $.ajax({
                    url: "../../../../api/getRequestData.php",
                    data: {
                        'serviceName': 'getResLocationAvailableData',
                        'LID': LID,
                        'LSID': LSID,
                        'QueryDate': dateStr
                    },
                    dataType: 'JSON',
                    type: 'POST'
                })
            
            let selectStartDay
            let selectEndDay

            selectDayArr = [data.ResultData.ReservingStart, data.ResultData.ReservingEnd]

            for (i in selectDayArr) {


                let {
                    year,
                    month,
                    day
                } = spiltDateStr(selectDayArr[i])

                // 创建Date对象(時間為當日凌晨00:00:00)
                if (selectDayArr[i] === data.ResultData.ReservingStart) {
                    selectStartDay = new Date(year, month, day);
                } else {
                    selectEndDay = new Date(year, month, day);
                }


            }




            var calendarEl = document.getElementById('calendar');
            //ToDoList
            // 渲染特定日期範圍的日曆
            var calendar = new FullCalendar.Calendar(calendarEl, {
                views: {
                    dayGridMonth: { // name of view
                        titleFormat: {
                            year: 'numeric',
                            month: '2-digit'
                        }
                        // other view-specific options here
                    }
                },
                customButtons: {
                    myNextButton: {
                        text: '>',
                        click: function() {
                            // 获取当前视图的日歷结束日期
                            var endDate = calendar.view.currentEnd;

                            // 判断当前视图的日歷结束日期是否超出最大允许日期
                            if (endDate < selectEndDay) {
                                calendar.next();
                            } else {
                                return;
                            }
                        }
                    },
                    myPrevButton: {
                        text: '<',
                        click: function() {
                            // 获取当前视图的日歷開始日期
                            var StartDate = calendar.view.currentStart;

                            // 判断当前视图的日歷開始日期是否超出最小允许日期
                            if (StartDate > selectStartDay) {
                                calendar.prev();
                            } else {
                                return;
                            }
                        }
                    }
                },
                headerToolbar: {
                    right: 'myPrevButton,myNextButton today', // 使用自定义的 myNextButton
                    left: 'title',
                },

                    // 自訂顯示
                    const days = ['日', '一', '二', '三', '四', '五', '六'];
                    return days[arg.date.getUTCDay()];
                },

                    dateElementTop.style.alignItems = 'center';
                    dateElementTop.style.justifyContent = "center"

                    //console.log(dateElementTop.parentNode.parentNode.parentNode.nodeName);
                    var trNode = dateElementTop.parentNode.parentNode.parentNode;
                    trNode.style.height = "40px";
                    var tdNode = dateElementTop.parentNode.parentNode;

                    // 比較日期，並將符合條件的日期文字設置為紅色

                    } else {

                        document.getElementById("selectDate").textContent = info.dateStr;

                        document.getElementById("confirmBtn").disabled = true



                        getResLocAvailInfo_Date(LID, LSID, info.dateStr)
                    }

                }
            });
            calendar.render();
            //var nextMonth1stDay = date.getUTCFullYear() + '-' + ("0"+(date.getUTCMonth()+1)).slice(-2) +"-"+ ("01");

    async function getResLocAvailInfo_Date(LID, LSID, dateStr, timeSlot) {
        let loading
        Swal.fire({
            html: '<img src="../../../../assets/gif/loading.gif" style="width: 100px; height: 100px;">',
            allowOutsideClick: false,
            showConfirmButton: false,
            didOpen: () => { // 在彈窗完全開啟後再賦值
                loading = Swal.getPopup(); // 取得彈窗對象
            }
        });


        try {
            let data;
            let timeData
                            data = await $.ajax({
                    url: "../../../../api/getRequestData.php",
                    data: {
                        'serviceName': 'getResLocationAvailableData',
                        'LID': LID,
                        'LSID': LSID,
                        'QueryDate': dateStr
                    },
                    dataType: 'JSON',
                    type: 'POST'
                })
                //generateDataArray 函式由 generateDataArrayToolBox.js 提供
                timeData = generateDataArray(data.ResultData.AvailableData)
            

            //ToDoList
            //渲染日期可選的時段
            let timeOptions = ``;
            for (let i = 0; i < timeData.length; i++) {

                let val = timeData[i]["Time"]

                                    //選擇可以被預約的時段
                    if (timeData[i]["allowBooking"] !== "N" ) {
                        let price = timeData[i]["Price"]
                        let payImmediatelyAfterBooking = timeData[i]["PayImmediatelyAfterBooking"]

                        timeOptions +=
                            `<div class="row mb-3 mx-4 timeSlot" id="time-${val}">
                                <div class="col-8" style="text-align:left; ">                        
                                    <label for="timeSlot-${val}"><b><font color = "darkgray">|</font>&nbsp</b> ${val}</label>
                                </div>
                                <div class="col-4" style="text-align:right">
                                    <input class="form-check-input" type="checkbox" onclick="selectOnlyOne(this)" name="timeSlot" id="timeSlot-${val}" value="${val}" data-price="${price}"  data-payImmediatelyAfterBooking="${payImmediatelyAfterBooking}"   aria-label="...">
                                </div>
                            </div></div>`
                    }
                   
                



            }

            document.getElementById('timeTable').innerHTML = timeOptions

            document.getElementById("timeTable").style.display = "block";

            document.getElementById('selectedtimeSlotNum').innerText = "0"

            document.getElementById("price").textContent = "$0"

            //如果有收到特定時段
            if (timeSlot) {
                let selectedCheckbox = document.querySelector(`input[type="checkbox"][name="timeSlot"][value="${timeSlot}"]`)
                selectedCheckbox.checked = true
                selectOnlyOne(selectedCheckbox)
            }

            

        } catch (error) {
            console.error('Error:', error);
        } finally {
            if (loading) {
                Swal.close();
            } // 請求完成後關閉 Swal
        }


    }

    function filterTimeSlot(startTime, endTime, thisElement) {

        //切換按鈕樣式
        document.querySelectorAll('#filterTimeSlot span').forEach(span => {
            span.classList.remove("button")
            span.classList.add("button-reverse")
        })

        thisElement.classList.remove("button-reverse")
        thisElement.classList.add("button")

        //將所有時段row隱藏
        document.querySelectorAll('div[id^="time-"]').forEach(time => {
            time.style.display = "none";
        });


        //顯示特定時段的row
        for (let i = startTime; i < endTime; i++) {

            let start = i.toString().padStart(2, '0') + ':00'
            let end = (i + 1).toString().padStart(2, '0') + ':00'
            let timeSlotElement = document.querySelector(`[id^="time-${start}"]`);


            if (timeSlotElement) {
                timeSlotElement.style.display = "flex";
            }

        }
    }

    function selectOnlyOne(selectedCheckbox) {
        // 取得所有的 checkbox
        const checkboxes = document.querySelectorAll('input[type="checkbox"][name="timeSlot"]');

        // 將所有 checkbox 的 checked 狀態設為 false
        checkboxes.forEach(checkbox => {
            if (checkbox !== selectedCheckbox) {
                checkbox.checked = false;
            }
        });

        if (selectedCheckbox.checked) {
            document.getElementById('selectedtimeSlotNum').innerText = "1"
        } else {
            document.getElementById('selectedtimeSlotNum').innerText = "0"
        }


                    if (selectedCheckbox.checked) {
                document.getElementById("price").textContent = "$" + selectedCheckbox.dataset.price
                //解鎖btn
                document.getElementById("confirmBtn").disabled = false
            } else {
                document.getElementById("price").textContent = "$0"
                //鎖住btn
                document.getElementById("confirmBtn").disabled = true
            }
        


    }

    function selectOnlyOneLocationSub(selectedCheckbox) {
        // 取得所有的 checkbox
        const checkboxes = document.querySelectorAll('input[type="checkbox"][name="locationSub"]');

        // 將所有 checkbox 的 checked 狀態設為 false
        checkboxes.forEach(checkbox => {
            if (checkbox !== selectedCheckbox) {
                checkbox.checked = false;
            }
        });

        const  timeSlotCheckbox = document.querySelector('input[name="timeSlot"][type="checkbox"]:checked');

        if (selectedCheckbox.checked && timeSlotCheckbox) {
            document.getElementById("price").textContent = "$" + selectedCheckbox.dataset.price
            //解鎖btn
            document.getElementById("confirmBtn").disabled = false
        } else {
            document.getElementById("price").textContent = "$0"
            //鎖住btn
            document.getElementById("confirmBtn").disabled = true
        }



    }

    function renderLocationSubSelectionList(dataArray) {
        let locationSubOptions = ``;
        for (let i = 0; i < dataArray.length; i++) {
            let LSID = dataArray[i]['LSID']
            let LSIDName = dataArray[i]['LSIDName']
            let price = dataArray[i]["Price"]
            let payImmediatelyAfterBooking = dataArray[i]["PayImmediatelyAfterBooking"]
            let charge = dataArray[i]['Charge']
            let description = dataArray[i]['Description']
            let minPrice = dataArray[i]["MinPrice"]
            let imageUrls = dataArray[i]["ImageUrls"]
            locationSubOptions +=
                `<div class="row mb-3 mx-4 timeSlot" id="${LSID}">
                            <div class="col-8" style="text-align:left; ">                        
                                <label for="locationSub-${LSID}"><b><font color = "darkgray">|</font>&nbsp</b> ${LSIDName}</label>
                            </div>
                            <div class="col-4" style="text-align:right">
                                <input class="form-check-input" type="checkbox" onclick="selectOnlyOneLocationSub(this)" name="locationSub" id="locationSub-${LSID}" value="${LSID}" data-price="${price}" data-payImmediatelyAfterBooking="${payImmediatelyAfterBooking}" 
                                data-lsid="${LSID}" data-lsidname="${LSIDName}"  data-charge="${charge}" data-description="${description}"  data-minprice="${minPrice}" data-imageurls="${imageUrls}"  aria-label="...">
                            </div>
                        </div></div>`
        }
        document.getElementById('locationSubTable').innerHTML = locationSubOptions
        document.getElementById("locationSubTable").style.display = "block";
    }

    function confirm() {
                    const checkedCheckbox = document.querySelector('input[type="checkbox"]:checked');
            document.querySelector('form#confirm_Form input[name="date"]').value = document.getElementById("selectDate").textContent;
            document.querySelector('form#confirm_Form input[name="timeSlot"]').value = checkedCheckbox.value;
            // dataset屬性會將所有data-屬性轉換為小寫。
            document.querySelector('form#confirm_Form input[name="price"]').value = checkedCheckbox.dataset.price;
            document.querySelector('form#confirm_Form input[name="payImmediatelyAfterBooking"]').value = checkedCheckbox.dataset.payimmediatelyafterbooking;
            document.getElementById('confirm_Form').submit()
               
    }

    function backFromConfirmPage(LID, LSID, date, timeSlot) {
        if (date && timeSlot) {
            // 清除先前选中日期的背景颜色
            document.querySelectorAll('.fc-day').forEach(function(day) {
                day.classList.remove('fc-day-clicked');
            });

            // 为点击的日期添加自定义的背景颜色
            document.querySelector(`[data-date="${date}"]`).classList.add("fc-day-clicked");


            document.getElementById("selectDate").textContent = date;



            getResLocAvailInfo_Date(LID, LSID, date, timeSlot)
        }
    }

    async function loadData(LID, LSID, date, timeSlot) {
        await getResLocAvailInfo(LID, LSID)
        backFromConfirmPage(LID, LSID, date, timeSlot)
    }
