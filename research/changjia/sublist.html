        function getLocationSubTableByCategory(LID, LIDName, LocCategoryID, LocCategoryArrayStr, CategoryImgURL, address, phone, businessHours, imageUrl, redirectFromIndex, redirectFromSearch, LocCategoryName, startDate, endDate, startTime, endTime, redirectFromFilter  ) {
            var loading = Swal.fire({
                html: '<img src="../../assets/gif/loading.gif" style="width: 100px; height: 100px;">',
                allowOutsideClick: false,
                showConfirmButton: false,
                onBeforeOpen: () => {
                    Swal.showLoading();
                }
            });

            document.getElementById("tableContainer").innerHTML = ""

            $.ajax({
                url: "ajax/createTable/",
                data: {
                    'LID': LID,
                    'LIDName': LIDName,
                    'CategoryID': LocCategoryID,
                    'CategoryName': LocCategoryName,
                    'CategoryArrayStr': LocCategoryArrayStr,
                    'CategoryImgURL': CategoryImgURL,
                    'address': address,
                    'phone': phone,
                    'businessHours': businessHours,
                    'imageUrl': imageUrl,
                    'redirectFromIndex': redirectFromIndex,
                    'redirectFromSearch': redirectFromSearch,
                    'redirectFromFilter': redirectFromFilter,
                    'startDate': startDate,
                    'endDate': endDate,
                    'startTime': startTime,
                    'endTime': endTime
                },
                dataType: 'html',
                type: 'POST',
                success: function(data) {
                    $('#tableContainer').html('').append(data);
                    var diaHtml = document.getElementById("outputDialog")?.innerHTML||"";
                    if (diaHtml != "") {
                        // 用 Swal.fire 顯示錯誤訊息
                        Swal.fire({
                            html: diaHtml,                  // 把回傳的 HTML 當內容
                            title: '',                   // 沒有標題
                            allowOutsideClick: true,     // 可以點旁邊關閉
                            showCloseButton: false,      // 沒有右上角關閉 X
                            showCancelButton: false,     // 沒有取消按鈕
                            confirmButtonText: '確定'    // 只有確定按鈕
                        });
                    } 
                    loading.close();
                },
                error: function(xhr, status, error) {
                    console.error('Error:', error);
                }
            });
        }

        function switchCategoryBtn() {
            if ($("#CategoryBtnDiv").css("display") === "flex") {
